<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>梅花易数占卜程序</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: "Microsoft YaHei", "SimHei", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        
        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }
        
        .content {
            padding: 30px;
        }
        
        .section {
            margin-bottom: 30px;
        }
        
        .section-title {
            font-size: 1.3em;
            color: #667eea;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }
        
        .category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .category-item {
            display: flex;
            align-items: center;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .category-item:hover {
            border-color: #667eea;
            background: #f5f7ff;
        }
        
        .category-item input[type="radio"] {
            margin-right: 10px;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        
        .category-item label {
            cursor: pointer;
            user-select: none;
        }
        
        .category-item.selected {
            border-color: #667eea;
            background: #f5f7ff;
            font-weight: bold;
        }
        
        .method-options {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .method-item {
            display: flex;
            align-items: center;
            padding: 15px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .method-item:hover {
            border-color: #667eea;
            background: #f5f7ff;
        }
        
        .method-item.selected {
            border-color: #667eea;
            background: #f5f7ff;
            font-weight: bold;
        }
        
        .method-item input[type="radio"] {
            margin-right: 10px;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        
        .method-item label {
            cursor: pointer;
            user-select: none;
        }
        
        .button-group {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .btn {
            padding: 15px 40px;
            font-size: 1.1em;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        
        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }
        
        .btn-secondary:hover {
            background: #e0e0e0;
        }
        
        .result-container {
            background: #f9f9f9;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 25px;
            min-height: 400px;
        }
        
        .result-content {
            font-family: "Courier New", monospace;
            white-space: pre-wrap;
            line-height: 1.8;
        }
        
        .result-header {
            font-size: 1.3em;
            color: #667eea;
            font-weight: bold;
            margin-bottom: 15px;
        }
        
        .result-section {
            margin-bottom: 20px;
        }
        
        .result-section-title {
            font-size: 1.1em;
            color: #764ba2;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .trigram-symbol {
            font-size: 1.5em;
            color: #d63031;
        }
        
        .hexagram-name {
            font-size: 1.3em;
            color: #e17055;
            font-weight: bold;
        }
        
        .interpretation {
            background: #fff3cd;
            padding: 15px;
            border-left: 4px solid #ffc107;
            margin-top: 10px;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #999;
        }
        
        .empty-result {
            text-align: center;
            padding: 60px 20px;
            color: #999;
            font-size: 1.1em;
        }
        
        .footer {
            text-align: center;
            padding: 20px;
            color: #999;
            font-size: 0.9em;
            border-top: 1px solid #e0e0e0;
        }
        
        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }
            
            .category-grid {
                grid-template-columns: 1fr;
            }
            
            .method-options {
                flex-direction: column;
            }
            
            .button-group {
                flex-direction: column;
            }
            
            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>梅花易数占卜程序</h1>
            <p>Meihua Yishu Divination System</p>
        </div>
        
        <div class="content">
            <!-- 占卜类别选择 -->
            <div class="section">
                <div class="section-title">选择占卜类别</div>
                <div class="category-grid" id="categoryGrid"></div>
            </div>
            
            <!-- 起卦方式选择 -->
            <div class="section">
                <div class="section-title">起卦方式</div>
                <div class="method-options">
                    <div class="method-item selected" onclick="selectMethod(true)">
                        <input type="radio" name="method" id="method1" value="true" checked>
                        <label for="method1">时间起卦（推荐）</label>
                    </div>
                    <div class="method-item" onclick="selectMethod(false)">
                        <input type="radio" name="method" id="method2" value="false">
                        <label for="method2">随机起卦</label>
                    </div>
                </div>
            </div>
            
            <!-- 操作按钮 -->
            <div class="section">
                <div class="button-group">
                    <button class="btn btn-primary" onclick="performDivination()">🔮 开始占卜</button>
                    <button class="btn btn-secondary" onclick="clearResults()">🗑️ 清空结果</button>
                </div>
            </div>
            
            <!-- 结果显示 -->
            <div class="section">
                <div class="section-title">占卜结果</div>
                <div class="result-container" id="resultContainer">
                    <div class="empty-result">
                        请选择占卜类别后点击"开始占卜"按钮
                    </div>
                </div>
            </div>
        </div>
        
        <div class="footer">
            梅花易数占卜程序 © 2025 | 仅供娱乐和学习传统文化之用
        </div>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script>
        // 梅花易数数据
        const TRIGRAM_NAMES = {
            1: "乾", 2: "兑", 3: "离", 4: "震",
            5: "巽", 6: "坎", 7: "艮", 8: "坤"
        };
        
        const TRIGRAM_SYMBOLS = {
            1: "☰", 2: "☱", 3: "☲", 4: "☳",
            5: "☴", 6: "☵", 7: "☶", 8: "☷"
        };
        
        const TRIGRAM_ELEMENTS = {
            1: "金", 2: "金", 3: "火", 4: "木",
            5: "木", 6: "水", 7: "土", 8: "土"
        };
        
        const HEXAGRAM_NAMES = {
            11: "乾为天", 12: "天泽履", 13: "天火同人", 14: "天雷无妄",
            15: "天风姤", 16: "天水讼", 17: "天山遯", 18: "天地否",
            21: "泽天夬", 22: "兑为泽", 23: "泽火革", 24: "泽雷随",
            25: "泽风大过", 26: "泽水困", 27: "泽山咸", 28: "泽地萃",
            31: "火天大有", 32: "火泽睽", 33: "离为火", 34: "火雷噬嗑",
            35: "火风鼎", 36: "火水未济", 37: "火山旅", 38: "火地晋",
            41: "雷天大壮", 42: "雷泽归妹", 43: "雷火丰", 44: "震为雷",
            45: "雷风恒", 46: "雷水解", 47: "雷山小过", 48: "雷地豫",
            51: "风天小畜", 52: "风泽中孚", 53: "风火家人", 54: "风雷益",
            55: "巽为风", 56: "风水涣", 57: "风山渐", 58: "风地观",
            61: "水天需", 62: "水泽节", 63: "水火既济", 64: "水雷屯",
            65: "水风井", 66: "坎为水", 67: "水山蹇", 68: "水地比",
            71: "山天大畜", 72: "山泽损", 73: "山火贲", 74: "山雷颐",
            75: "山风蛊", 76: "山水蒙", 77: "艮为山", 78: "山地剥",
            81: "地天泰", 82: "地泽临", 83: "地火明夷", 84: "地雷复",
            85: "地风升", 86: "地水师", 87: "地山谦", 88: "坤为地"
        };
        
        const DIVINATION_CATEGORIES = {
            1: "天时占", 2: "人事占", 3: "家宅占", 4: "屋舍占",
            5: "婚姻占", 6: "生产占", 7: "饮食占", 8: "求谋占",
            9: "求名占", 10: "求财占", 11: "交易占", 12: "出行占",
            13: "行人占", 14: "谒见占", 15: "失物占", 16: "疾病占",
            17: "官讼占", 18: "坟墓占"
        };
        
        const ELEMENT_GENERATION = {
            "金": "水", "水": "木", "木": "火", "火": "土", "土": "金"
        };
        
        const ELEMENT_RESTRICTION = {
            "金": "木", "木": "土", "土": "水", "水": "火", "火": "金"
        };
        
        // 初始化界面
        function initCategories() {
            const grid = document.getElementById('categoryGrid');
            for (let num in DIVINATION_CATEGORIES) {
                const div = document.createElement('div');
                div.className = 'category-item';
                if (num == 2) div.classList.add('selected');
                div.onclick = () => selectCategory(num);
                
                div.innerHTML = `
                    <input type="radio" name="category" id="cat${num}" value="${num}" ${num == 2 ? 'checked' : ''}>
                    <label for="cat${num}">${num}. ${DIVINATION_CATEGORIES[num]}</label>
                `;
                grid.appendChild(div);
            }
        }
        
        function selectCategory(num) {
            document.querySelectorAll('.category-item').forEach(item => {
                item.classList.remove('selected');
            });
            event.currentTarget.classList.add('selected');
            document.getElementById('cat' + num).checked = true;
        }
        
        function selectMethod(useTime) {
            document.querySelectorAll('.method-item').forEach(item => {
                item.classList.remove('selected');
            });
            event.currentTarget.classList.add('selected');
            
            if (useTime) {
                document.getElementById('method1').checked = true;
            } else {
                document.getElementById('method2').checked = true;
            }
        }
        
        function calculateTrigram(value) {
            const remainder = value % 8;
            return remainder === 0 ? 8 : remainder;
        }
        
        function calculateMovingLine(value) {
            const remainder = value % 6;
            return remainder === 0 ? 6 : remainder;
        }
        
        function getTimeValue() {
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth() + 1;
            const day = now.getDate();
            const hour = now.getHours();
            const hourBranch = ((hour + 1) / 2) % 12 || 12;
            
            return { year, month, day, hour, hourBranch: Math.floor(hourBranch) };
        }
        
        function getRandomValue() {
            return Math.floor(Math.random() * 32) + 1;
        }
        
        function changeTrigramLine(trigram, line) {
            const trigramBinary = {
                1: 0b111, 2: 0b011, 3: 0b101, 4: 0b001,
                5: 0b110, 6: 0b010, 7: 0b100, 8: 0b000
            };
            const binaryToTrigram = {};
            for (let k in trigramBinary) {
                binaryToTrigram[trigramBinary[k]] = parseInt(k);
            }
            
            let binary = trigramBinary[trigram];
            binary ^= (1 << (line - 1));
            
            return binaryToTrigram[binary];
        }
        
        function getElementRelationship(body, use) {
            if (body === use) {
                return "比和";
            } else if (ELEMENT_GENERATION[use] === body) {
                return "用生体";
            } else if (ELEMENT_GENERATION[body] === use) {
                return "体生用";
            } else if (ELEMENT_RESTRICTION[body] === use) {
                return "体克用";
            } else if (ELEMENT_RESTRICTION[use] === body) {
                return "用克体";
            } else {
                return "无关系";
            }
        }
        
        function interpretDivination(category, relationship) {
            const baseInterpretations = {
                "比和": "吉利，事情顺遂",
                "用生体": "大吉，有进益之喜",
                "体生用": "不利，有耗损之患",
                "体克用": "可成，但较迟缓",
                "用克体": "凶，不宜进行"
            };
            
            const specificInterpretations = {
                2: {
                    "比和": "谋为吉利，事情顺遂",
                    "用生体": "有进益之喜，贵人相助",
                    "体生用": "有耗失之患，需谨慎行事",
                    "体克用": "事可成但需时日",
                    "用克体": "诸事不宜，需等待时机"
                },
                5: {
                    "比和": "婚姻吉利，良配佳偶",
                    "用生体": "婚易成，因婚有得",
                    "体生用": "婚难成，因婚有失",
                    "体克用": "可成但成之迟",
                    "用克体": "不可成，成亦有害"
                },
                10: {
                    "比和": "求财顺利，利快意",
                    "用生体": "有财，且有进益之喜",
                    "体生用": "无财，且有损耗之忧",
                    "体克用": "有财但得财较迟",
                    "用克体": "无财，不宜求财"
                },
                16: {
                    "比和": "疾病易安",
                    "用生体": "病即愈",
                    "体生用": "病难愈，迁延难好",
                    "体克用": "病易安，勿药有喜",
                    "用克体": "虽药无功，需谨慎"
                }
            };
            
            const categoryName = DIVINATION_CATEGORIES[category];
            const specific = specificInterpretations[category]?.[relationship] || baseInterpretations[relationship];
            
            return `${categoryName}：${specific}`;
        }
        
        function performDivination() {
            const category = parseInt(document.querySelector('input[name="category"]:checked').value);
            const useTime = document.getElementById('method1').checked;
            
            // 显示加载状态
            const resultContainer = document.getElementById('resultContainer');
            resultContainer.innerHTML = '<div class="loading">正在占卜中，请稍候...</div>';
            
            setTimeout(() => {
                try {
                    let upperTrigram, lowerTrigram, movingLine;
                    
                    if (useTime) {
                        const time = getTimeValue();
                        const upperSum = time.year + time.month + time.day;
                        upperTrigram = calculateTrigram(upperSum);
                        
                        const lowerSum = time.year + time.month + time.day + time.hourBranch;
                        lowerTrigram = calculateTrigram(lowerSum);
                        
                        movingLine = calculateMovingLine(lowerSum);
                    } else {
                        const randomValue1 = getRandomValue();
                        const randomValue2 = getRandomValue();
                        upperTrigram = calculateTrigram(randomValue1);
                        lowerTrigram = calculateTrigram(randomValue2);
                        movingLine = calculateMovingLine(randomValue1 + randomValue2);
                    }
                    
                    // 计算变卦
                    let changedUpper = upperTrigram;
                    let changedLower = lowerTrigram;
                    
                    if (movingLine <= 3) {
                        changedLower = changeTrigramLine(lowerTrigram, movingLine);
                    } else {
                        changedUpper = changeTrigramLine(upperTrigram, movingLine - 3);
                    }
                    
                    // 体用分析
                    let bodyTrigram, useTrigram;
                    if (movingLine <= 3) {
                        bodyTrigram = upperTrigram;
                        useTrigram = lowerTrigram;
                    } else {
                        bodyTrigram = lowerTrigram;
                        useTrigram = upperTrigram;
                    }
                    
                    const bodyElement = TRIGRAM_ELEMENTS[bodyTrigram];
                    const useElement = TRIGRAM_ELEMENTS[useTrigram];
                    const relationship = getElementRelationship(bodyElement, useElement);
                    
                    // 获取卦名
                    const mainHexagramName = HEXAGRAM_NAMES[upperTrigram * 10 + lowerTrigram] || 
                                            `${TRIGRAM_NAMES[upperTrigram]}${TRIGRAM_NAMES[lowerTrigram]}`;
                    const changedHexagramName = HEXAGRAM_NAMES[changedUpper * 10 + changedLower] || 
                                               `${TRIGRAM_NAMES[changedUpper]}${TRIGRAM_NAMES[changedLower]}`;
                    
                    // 解释
                    const interpretation = interpretDivination(category, relationship);
                    
                    // 构建结果
                    const result = {
                        '时间': new Date().toLocaleString('zh-CN'),
                        '占卜类别': DIVINATION_CATEGORIES[category],
                        '本卦': {
                            '上卦': `${TRIGRAM_NAMES[upperTrigram]}${TRIGRAM_SYMBOLS[upperTrigram]}`,
                            '下卦': `${TRIGRAM_NAMES[lowerTrigram]}${TRIGRAM_SYMBOLS[lowerTrigram]}`,
                            '卦名': mainHexagramName,
                            '动爻': `第${movingLine}爻`
                        },
                        '变卦': {
                            '上卦': `${TRIGRAM_NAMES[changedUpper]}${TRIGRAM_SYMBOLS[changedUpper]}`,
                            '下卦': `${TRIGRAM_NAMES[changedLower]}${TRIGRAM_SYMBOLS[changedLower]}`,
                            '卦名': changedHexagramName
                        },
                        '体用': {
                            '体卦': `${TRIGRAM_NAMES[bodyTrigram]}（${bodyElement}）`,
                            '用卦': `${TRIGRAM_NAMES[useTrigram]}（${useElement}）`,
                            '关系': relationship
                        },
                        '卦辞解释': interpretation
                    };
                    
                    displayResult(result);
                } catch (error) {
                    resultContainer.innerHTML = '<div class="empty-result">占卜失败：' + error.message + '</div>';
                }
            }, 500);
        }
        
        function displayResult(result) {
            const resultContainer = document.getElementById('resultContainer');
            
            let html = '<div class="result-content">';
            html += '<div class="result-header">════════════════════════════════════════</div>';
            html += '<div class="result-header" style="text-align: center;">梅花易数占卜结果</div>';
            html += '<div class="result-header">════════════════════════════════════════</div>';
            html += '<br>';
            
            html += '<div><strong>占卜时间：</strong>' + result['时间'] + '</div>';
            html += '<div><strong>占卜类别：</strong>' + result['占卜类别'] + '</div>';
            html += '<br>';
            
            // 本卦
            html += '<div class="result-section">';
            html += '<div class="result-section-title">【本卦】</div>';
            html += '<div>　上卦：<span class="trigram-symbol">' + result['本卦']['上卦'] + '</span></div>';
            html += '<div>　下卦：<span class="trigram-symbol">' + result['本卦']['下卦'] + '</span></div>';
            html += '<div>　卦名：<span class="hexagram-name">' + result['本卦']['卦名'] + '</span></div>';
            html += '<div>　动爻：' + result['本卦']['动爻'] + '</div>';
            html += '</div>';
            
            // 变卦
            html += '<div class="result-section">';
            html += '<div class="result-section-title">【变卦】</div>';
            html += '<div>　上卦：<span class="trigram-symbol">' + result['变卦']['上卦'] + '</span></div>';
            html += '<div>　下卦：<span class="trigram-symbol">' + result['变卦']['下卦'] + '</span></div>';
            html += '<div>　卦名：<span class="hexagram-name">' + result['变卦']['卦名'] + '</span></div>';
            html += '</div>';
            
            // 体用分析
            html += '<div class="result-section">';
            html += '<div class="result-section-title">【体用分析】</div>';
            html += '<div>　体卦：' + result['体用']['体卦'] + '</div>';
            html += '<div>　用卦：' + result['体用']['用卦'] + '</div>';
            html += '<div>　关系：<strong>' + result['体用']['关系'] + '</strong></div>';
            html += '</div>';
            
            // 卦辞解释
            html += '<div class="result-section">';
            html += '<div class="result-section-title">【卦辞解释】</div>';
            html += '<div class="interpretation">' + result['卦辞解释'] + '</div>';
            html += '</div>';
            
            html += '<div class="result-header">════════════════════════════════════════</div>';
            html += '</div>';
            
            resultContainer.innerHTML = html;
        }
        
        function clearResults() {
            const resultContainer = document.getElementById('resultContainer');
            resultContainer.innerHTML = '<div class="empty-result">请选择占卜类别后点击"开始占卜"按钮</div>';
        }
        
        // 页面加载时初始化
        window.addEventListener('DOMContentLoaded', function() {
            initCategories();
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>梅花易数占卜程序</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: "Microsoft YaHei", "SimHei", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        
        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }
        
        .content {
            padding: 30px;
        }
        
        .section {
            margin-bottom: 30px;
        }
        
        .section-title {
            font-size: 1.3em;
            color: #667eea;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }
        
        .category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .category-item {
            display: flex;
            align-items: center;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .category-item:hover {
            border-color: #667eea;
            background: #f5f7ff;
        }
        
        .category-item input[type="radio"] {
            margin-right: 10px;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        
        .category-item label {
            cursor: pointer;
            user-select: none;
        }
        
        .category-item.selected {
            border-color: #667eea;
            background: #f5f7ff;
            font-weight: bold;
        }
        
        .method-options {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .method-item {
            display: flex;
            align-items: center;
            padding: 15px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .method-item:hover {
            border-color: #667eea;
            background: #f5f7ff;
        }
        
        .method-item.selected {
            border-color: #667eea;
            background: #f5f7ff;
            font-weight: bold;
        }
        
        .method-item input[type="radio"] {
            margin-right: 10px;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        
        .method-item label {
            cursor: pointer;
            user-select: none;
        }
        
        .button-group {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .btn {
            padding: 15px 40px;
            font-size: 1.1em;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        
        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }
        
        .btn-secondary:hover {
            background: #e0e0e0;
        }
        
        .result-container {
            background: #f9f9f9;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 25px;
            min-height: 400px;
        }
        
        .result-content {
            font-family: "Courier New", monospace;
            white-space: pre-wrap;
            line-height: 1.8;
        }
        
        .result-header {
            font-size: 1.3em;
            color: #667eea;
            font-weight: bold;
            margin-bottom: 15px;
        }
        
        .result-section {
            margin-bottom: 20px;
        }
        
        .result-section-title {
            font-size: 1.1em;
            color: #764ba2;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .trigram-symbol {
            font-size: 1.5em;
            color: #d63031;
        }
        
        .hexagram-name {
            font-size: 1.3em;
            color: #e17055;
            font-weight: bold;
        }
        
        .interpretation {
            background: #fff3cd;
            padding: 15px;
            border-left: 4px solid #ffc107;
            margin-top: 10px;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #999;
        }
        
        .empty-result {
            text-align: center;
            padding: 60px 20px;
            color: #999;
            font-size: 1.1em;
        }
        
        .footer {
            text-align: center;
            padding: 20px;
            color: #999;
            font-size: 0.9em;
            border-top: 1px solid #e0e0e0;
        }
        
        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }
            
            .category-grid {
                grid-template-columns: 1fr;
            }
            
            .method-options {
                flex-direction: column;
            }
            
            .button-group {
                flex-direction: column;
            }
            
            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>梅花易数占卜程序</h1>
            <p>Meihua Yishu Divination System</p>
        </div>
        
        <div class="content">
            <!-- 占卜类别选择 -->
            <div class="section">
                <div class="section-title">选择占卜类别</div>
                <div class="category-grid" id="categoryGrid">
                    {% for num, name in categories.items()|sort %}
                    <div class="category-item" onclick="selectCategory({{ num }})">
                        <input type="radio" name="category" id="cat{{ num }}" value="{{ num }}" {% if num == 2 %}checked{% endif %}>
                        <label for="cat{{ num }}">{{ num }}. {{ name }}</label>
                    </div>
                    {% endfor %}
                </div>
            </div>
            
            <!-- 起卦方式选择 -->
            <div class="section">
                <div class="section-title">起卦方式</div>
                <div class="method-options">
                    <div class="method-item selected" onclick="selectMethod(true)">
                        <input type="radio" name="method" id="method1" value="true" checked>
                        <label for="method1">时间+IP地址（推荐）</label>
                    </div>
                    <div class="method-item" onclick="selectMethod(false)">
                        <input type="radio" name="method" id="method2" value="false">
                        <label for="method2">仅使用时间</label>
                    </div>
                </div>
            </div>
            
            <!-- 操作按钮 -->
            <div class="section">
                <div class="button-group">
                    <button class="btn btn-primary" onclick="performDivination()">🔮 开始占卜</button>
                    <button class="btn btn-secondary" onclick="clearResults()">🗑️ 清空结果</button>
                </div>
            </div>
            
            <!-- 结果显示 -->
            <div class="section">
                <div class="section-title">占卜结果</div>
                <div class="result-container" id="resultContainer">
                    <div class="empty-result">
                        请选择占卜类别后点击"开始占卜"按钮
                    </div>
                </div>
            </div>
        </div>
        
        <div class="footer">
            梅花易数占卜程序 © 2025 | 仅供娱乐和学习传统文化之用
        </div>
    </div>
    
    <script>
        function selectCategory(num) {
            // 更新选中状态
            document.querySelectorAll('.category-item').forEach(item => {
                item.classList.remove('selected');
            });
            event.currentTarget.classList.add('selected');
            
            // 选中对应的radio
            document.getElementById('cat' + num).checked = true;
        }
        
        function selectMethod(useIp) {
            // 更新选中状态
            document.querySelectorAll('.method-item').forEach(item => {
                item.classList.remove('selected');
            });
            event.currentTarget.classList.add('selected');
            
            // 选中对应的radio
            if (useIp) {
                document.getElementById('method1').checked = true;
            } else {
                document.getElementById('method2').checked = true;
            }
        }
        
        function performDivination() {
            // 获取选择的类别
            const category = parseInt(document.querySelector('input[name="category"]:checked').value);
            const useIp = document.getElementById('method1').checked;
            
            // 显示加载状态
            const resultContainer = document.getElementById('resultContainer');
            resultContainer.innerHTML = '<div class="loading">正在占卜中，请稍候...</div>';
            
            // 发送请求
            fetch('/divine', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    category: category,
                    use_ip: useIp
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    displayResult(data.result);
                } else {
                    resultContainer.innerHTML = '<div class="empty-result">占卜失败：' + data.error + '</div>';
                }
            })
            .catch(error => {
                resultContainer.innerHTML = '<div class="empty-result">占卜失败：' + error + '</div>';
            });
        }
        
        function displayResult(result) {
            const resultContainer = document.getElementById('resultContainer');
            
            let html = '<div class="result-content">';
            html += '<div class="result-header">════════════════════════════════════════</div>';
            html += '<div class="result-header" style="text-align: center;">梅花易数占卜结果</div>';
            html += '<div class="result-header">════════════════════════════════════════</div>';
            html += '<br>';
            
            html += '<div><strong>占卜时间：</strong>' + result['时间'] + '</div>';
            html += '<div><strong>占卜类别：</strong>' + result['占卜类别'] + '</div>';
            html += '<br>';
            
            // 本卦
            html += '<div class="result-section">';
            html += '<div class="result-section-title">【本卦】</div>';
            html += '<div>　上卦：<span class="trigram-symbol">' + result['本卦']['上卦'] + '</span></div>';
            html += '<div>　下卦：<span class="trigram-symbol">' + result['本卦']['下卦'] + '</span></div>';
            html += '<div>　卦名：<span class="hexagram-name">' + result['本卦']['卦名'] + '</span></div>';
            html += '<div>　动爻：' + result['本卦']['动爻'] + '</div>';
            html += '</div>';
            
            // 变卦
            html += '<div class="result-section">';
            html += '<div class="result-section-title">【变卦】</div>';
            html += '<div>　上卦：<span class="trigram-symbol">' + result['变卦']['上卦'] + '</span></div>';
            html += '<div>　下卦：<span class="trigram-symbol">' + result['变卦']['下卦'] + '</span></div>';
            html += '<div>　卦名：<span class="hexagram-name">' + result['变卦']['卦名'] + '</span></div>';
            html += '</div>';
            
            // 体用分析
            html += '<div class="result-section">';
            html += '<div class="result-section-title">【体用分析】</div>';
            html += '<div>　体卦：' + result['体用']['体卦'] + '</div>';
            html += '<div>　用卦：' + result['体用']['用卦'] + '</div>';
            html += '<div>　关系：<strong>' + result['体用']['关系'] + '</strong></div>';
            html += '</div>';
            
            // 卦辞解释
            html += '<div class="result-section">';
            html += '<div class="result-section-title">【卦辞解释】</div>';
            html += '<div class="interpretation">' + result['卦辞解释'] + '</div>';
            html += '</div>';
            
            html += '<div class="result-header">════════════════════════════════════════</div>';
            html += '</div>';
            
            resultContainer.innerHTML = html;
        }
        
        function clearResults() {
            const resultContainer = document.getElementById('resultContainer');
            resultContainer.innerHTML = '<div class="empty-result">请选择占卜类别后点击"开始占卜"按钮</div>';
        }
        
        // 初始化选中状态
        document.addEventListener('DOMContentLoaded', function() {
            document.querySelector('.category-item').classList.add('selected');
        });
    </script>
</body>
</html>
